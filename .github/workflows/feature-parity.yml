name: Feature parity contract

on:
  pull_request:
  workflow_dispatch:

jobs:
  parity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shared client contract
        run: python3 scripts/check_feature_parity.py
      - name: Build web client
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Analyze Android client
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://thetabpos-api.onrender.com
