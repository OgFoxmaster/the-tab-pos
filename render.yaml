# Render blueprint for Thetabpos: FastAPI + PostgreSQL + static React site.
#
# Deploy with the "Deploy to Render" button in README.md, or Render Dashboard ->
# New -> Blueprint -> select this repository. Sign in with the GitHub account that
# owns the repository, verify your email, and approve the services.
#
# After the first deploy:
#   * If Render had to suffix a service name, update CORS_ORIGINS, APP_WEB_URL and
#     VITE_API_BASE_URL to the URLs Render shows, then redeploy.
#   * Add the M-Pesa Daraja variables (MPESA_CONSUMER_KEY, MPESA_CONSUMER_SECRET,
#     MPESA_SHORTCODE, MPESA_PASSKEY, MPESA_CALLBACK_URL, MPESA_CALLBACK_TOKEN)
#     on the API service to turn on M-Pesa.
#   * Add MAILTRAP_API_TOKEN, MAILTRAP_FROM and MAILTRAP_FROM_NAME for password-reset email.
#   * Add ZAI_API_KEY / EXA_API_KEY for the AI analyst (optional).
databases:
  - name: thetabpos-db
    databaseName: thetabpos
    user: thetabpos
    plan: free

services:
  - type: web
    name: thetabpos-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      - key: MAILTRAP_FROM_NAME
        value: The Tab POS
      - key: SEED_DEMO_DATA
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: thetabpos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      - key: STORE_NAME
        value: Thetabpos
      - key: STORE_TAGLINE
        value: Liquor Store
      - key: STORE_CURRENCY
        value: KES
      - key: VAT_RATE
        value: "0.16"
      - key: CORS_ORIGINS
        value: https://thetab.co.ke,https://www.thetab.co.ke
      - key: APP_WEB_URL
        value: https://thetab.co.ke
      - key: PASSWORD_RESET_MINUTES
        value: "30"
      - key: MAILTRAP_HOST
        value: live.smtp.mailtrap.io
      - key: MAILTRAP_PORT
        value: "587"
      - key: MAILTRAP_USERNAME
        value: api
      - key: MAILTRAP_API_TOKEN
        sync: false
      - key: MAILTRAP_FROM
        value: hello@thetab.co.ke
        value: hello@thetab.co.ke
      - key: MAILTRAP_FROM_NAME
        value: The Tab POS
      - key: APP_ENV
        value: production
      - key: OFFLINE_SALE_MAX_AGE_DAYS
        value: "14"
      - key: OFFLINE_SALE_MAX_FUTURE_MINUTES
        value: "10"
      - key: MPESA_ENV
        value: production
      - key: MPESA_SIMULATE
        value: "false"

  - type: web
    name: thetabpos
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.thetab.co.ke
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
