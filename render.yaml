# Render blueprint: one account, one click, API + PostgreSQL + static web app.
#
# 1. Push this repository to GitHub.
# 2. Render Dashboard -> New -> Blueprint -> select the repository.
# 3. Fill in the "sync: false" secrets when prompted (see DEPLOYMENT.md).
# 4. After the first deploy, open the web URL and create the owner account with
#    the shop's Gmail address. Staff logins are then created from the Users page.
databases:
  - name: thetabpos-db
    databaseName: thetabpos
    user: thetabpos
    plan: free

services:
  - type: web
    name: thetabpos-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: thetabpos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      - key: STORE_NAME
        value: Thetabpos
      - key: STORE_TAGLINE
        value: Liquor Store
      - key: STORE_CURRENCY
        value: KES
      - key: VAT_RATE
        value: "0.16"
      - key: CORS_ORIGINS
        sync: false
      - key: APP_WEB_URL
        sync: false
      - key: OWNER_SIGNUP_EMAILS
        sync: false
      - key: OWNER_SIGNUP_CODE
        sync: false
      - key: PASSWORD_RESET_MINUTES
        value: "30"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_SSL
        value: "false"
      - key: MPESA_ENV
        value: production
      - key: MPESA_SIMULATE
        value: "false"
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_CALLBACK_TOKEN
        sync: false
      - key: AI_MODEL
        value: glm-4-flash
      - key: ZAI_API_BASE
        value: https://api.z.ai/api/paas/v4
      - key: ZAI_API_KEY
        sync: false
      - key: EXA_NUM_RESULTS
        value: "5"
      - key: EXA_API_KEY
        sync: false

  - type: web
    name: thetabpos
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
